name: Bug
description: Report behaviour that differs from the intended behaviour.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How does this affect the user?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Add browser, device, application version, or other relevant context.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Supporting material
      description: Add screenshots, recordings, logs, or examples where useful.
    validations:
      required: false
